<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorHub 創作者個人作品集與互動牆</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 3rem;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: var(--bg-color);
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .profile-grid {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    @media (max-width: 600px) {
      .profile-grid {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
    }

    .avatar-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .avatar-box {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-color);
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-box .plus-icon {
      font-size: 1.5rem;
      color: var(--text-muted);
    }

    .avatar-box .upload-text {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .upload-btn {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .profile-fields {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .header-add-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .header-add-btn:hover {
      background: var(--primary-hover);
    }

    .project-item {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      position: relative;
    }

    .project-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .project-title-label {
      font-weight: bold;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .delete-project-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .delete-project-btn:hover {
      background: var(--danger-hover);
    }

    .publish-section {
      text-align: center;
      background: linear-gradient(to bottom, #ffffff, #f1f5f9);
    }

    .publish-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .publish-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .publish-btn:hover {
      background: var(--primary-hover);
    }

    .visitor-profile-card {
      text-align: center;
    }

    .visitor-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 2px solid var(--border);
    }

    .visitor-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .visitor-bio {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .project-card {
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .project-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .project-tag {
      background: #e0e7ff;
      color: var(--primary);
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
    }

    .project-footer {
      display: flex;
      justify-content: flex-end;
    }

    .like-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .like-btn:hover {
      background: #f1f5f9;
    }

    .creators-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }

    .creator-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      background: var(--bg-color);
      transition: border-color 0.2s;
    }

    .creator-card:hover {
      border-color: var(--primary);
    }

    .creator-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
    }

    .creator-info h4 {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .creator-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="nav-brand" id="navBrand">CreatorHub</a>
    <div class="nav-actions">
      <div id="previewBtnContainer"></div>
      <button class="btn-secondary" id="langSwitchBtn">EN / 中文</button>
    </div>
  </header>

  <div class="container" id="mainContainer">
    <!-- 內容會透過 JavaScript 動態載入 -->
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-firestore.js";

    // 💡 請在此處填入您的真實 Firebase 設定
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const translations = {
      zh: {
        site_title: "✨ CreatorHub 創作者個人作品集與互動牆",
        nav_brand: "CreatorHub",
        profile_title: "個人檔案設定",
        avatar_text: "上傳頭貼",
        name_label: "創作者名稱",
        bio_label: "個人簡介 / 座右銘",
        portfolio_title: "精選作品集",
        add_project_btn: "+ 新增作品",
        publish_title: "發佈您的個人網站",
        publish_desc: "點擊下方按鈕將您的最新修改儲存至雲端！",
        publish_btn: "🚀 儲存並同步至雲端",
        my_comments_title: "訪客留言與互動紀錄",
        my_comments_desc: "這裡顯示所有訪客留給您的寶貴意見與討論串：",
        community_title: "探索其他創作者",
        community_desc: "點擊卡片即可造訪其他創作者的個人作品集！",
        no_creators: "目前還沒有其他創作者上線。"
      },
      en: {
        site_title: "✨ CreatorHub Portfolio & Interaction Wall",
        nav_brand: "CreatorHub",
        profile_title: "Profile Settings",
        avatar_text: "Upload Avatar",
        name_label: "Creator Name",
        bio_label: "Bio / Motto",
        portfolio_title: "Featured Portfolio",
        add_project_btn: "+ Add Project",
        publish_title: "Publish Your Portfolio",
        publish_desc: "Click below to save your changes to the cloud!",
        publish_btn: "🚀 Save & Sync to Cloud",
        my_comments_title: "Visitor Comments & Threads",
        my_comments_desc: "Here are comments and discussion threads from visitors:",
        community_title: "Explore Other Creators",
        community_desc: "Click any card to visit other creators' portfolios!",
        no_creators: "No other creators online yet."
      }
    };

    let currentLang = 'zh';

    document.getElementById('langSwitchBtn').onclick = () => {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.getElementById('langSwitchBtn').textContent = currentLang === 'zh' ? 'EN / 中文' : '中文 / EN';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) {
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.placeholder = translations[currentLang][key];
          } else {
            el.textContent = translations[currentLang][key];
          }
        }
      });
    };

    const urlParams = new URLSearchParams(window.location.search);
    const creatorIdFromUrl = urlParams.get('id');
    const mainContainer = document.getElementById('mainContainer');
    const previewBtnContainer = document.getElementById('previewBtnContainer');
    const DEFAULT_EDITOR_ID = "my_portfolio_demo";

    initApp();

    async function initApp() {
      if (creatorIdFromUrl) {
        await renderVisitorMode(creatorIdFromUrl);
      } else {
        await renderEditorMode(DEFAULT_EDITOR_ID);
      }
    }

    function buildCommentItemHtml(c, commentIndex) {
      const timeStr = c.createdAt ? new Date(c.createdAt).toLocaleString() : '';
      
      let repliesHtml = '';
      if (c.replies && c.replies.length > 0) {
        c.replies.forEach(r => {
          const rTimeStr = r.createdAt ? new Date(r.createdAt).toLocaleString() : '';
          repliesHtml += `
            <div style="margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: rgba(0,0,0,0.03); border-left: 2px solid var(--primary); border-radius: 4px;">
              <div style="font-size: 0.8rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between;">
                <span>💬 ${escapeHtml(r.name)}</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;">${rTimeStr}</span>
              </div>
              <div style="font-size: 0.9rem; margin-top: 0.2rem; color: var(--text-main);">${escapeHtml(r.text)}</div>
            </div>
          `;
        });
      }

      return `
        <div class="comment-item" style="margin-bottom: 1.25rem; border: 1px solid var(--border); padding: 1rem; border-radius: 6px; background: var(--card-bg);" data-comment-idx="${commentIndex}">
          <div class="comment-header" style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
            <span class="comment-author" style="font-weight: bold; color: var(--text-main);">💬 ${escapeHtml(c.name)}</span>
            <span>${timeStr}</span>
          </div>
          <div class="comment-content" style="margin: 0.5rem 0 0.75rem 0; font-size: 0.95rem;">${escapeHtml(c.text)}</div>
          
          <div class="reply-list" style="margin-left: 1.5rem; margin-bottom: 0.75rem;">
            ${repliesHtml}
          </div>

          <div class="sub-reply-box" style="margin-left: 1.5rem; border-top: 1px dashed var(--border); padding-top: 0.5rem;">
            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.4rem;">
              <input type="text" class="sub-reply-name" placeholder="您的稱呼" style="flex: 1; padding: 0.3rem 0.5rem; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 4px;">
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <input type="text" class="sub-reply-text" placeholder="回覆這則留言..." style="flex: 3; padding: 0.3rem 0.5rem; font-size: 0.85rem; border: 1px solid var(--border); border-radius: 4px;">
              <button type="button" class="submit-sub-reply-btn" data-comment-index="${commentIndex}" style="background: var(--primary); color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">回覆</button>
            </div>
          </div>
        </div>
      `;
    }

    async function renderVisitorMode(uId) {
      previewBtnContainer.innerHTML = `<button class="btn-secondary" id="editModeBtn">✏️ 返回編輯模式</button>`;
      document.getElementById('editModeBtn').onclick = () => {
        window.location.href = window.location.pathname;
      };

      try {
        const docRef = doc(db, "users", uId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          const avatarUrl = data.avatar || 'https://via.placeholder.com/120';
          const name = data.name || '無名創作者';
          const bio = data.bio || '這位創作者還沒有寫自我介紹。';
          const projects = data.projects || [];
          const comments = data.comments || [];

          let projectsHtml = '';
          if (projects.length > 0) {
            projects.forEach((p, idx) => {
              const tagsArray = p.tags ? p.tags.split(' ').filter(t => t.trim() !== '') : [];
              let tagsHtml = '';
              tagsArray.forEach(tag => {
                tagsHtml += `<span class="project-tag">${escapeHtml(tag)}</span>`;
              });

              projectsHtml += `
                <div class="project-card">
                  <h3 class="project-title">${escapeHtml(p.title || '未命名專案')}</h3>
                  <p class="project-desc">${escapeHtml(p.desc || '無詳細說明。')}</p>
                  <div class="project-tags">${tagsHtml}</div>
                  <div class="project-footer">
                    <button class="like-btn" data-project-index="${idx}">
                      ❤️ <span class="like-count">${p.likes || 0}</span>
                    </button>
                  </div>
                </div>
              `;
            });
          } else {
            projectsHtml = `<p style="color: var(--text-muted); grid-column: 1/-1;">此創作者尚未發表任何專案。</p>`;
          }

          let commentsHtml = '';
          if (comments.length > 0) {
            comments.forEach((c, idx) => {
              commentsHtml += buildCommentItemHtml(c, idx);
            });
          } else {
            commentsHtml = `<p id="noCommentsMsg" style="color: var(--text-muted); font-size: 0.9rem;">目前還沒有人留言，趕快留下你的第一則評論吧！</p>`;
          }

          mainContainer.innerHTML = `
            <div class="card visitor-profile-card">
              <img src="${avatarUrl}" alt="頭貼" class="visitor-avatar">
              <h1 class="visitor-name">${escapeHtml(name)}</h1>
              <p class="visitor-bio">${escapeHtml(bio)}</p>
            </div>

            <div class="card">
              <h2 class="section-title">📂 精選作品專案</h2>
              <div class="projects-grid">${projectsHtml}</div>
            </div>

            <div class="card">
              <h2 class="section-title">💬 訪客留言板</h2>
              <div class="comment-list" id="commentListContainer">
                ${commentsHtml}
              </div>
              <div class="comment-form-box" style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">留下您的主留言</h3>
                <div class="form-group" style="margin-bottom: 1rem;">
                  <input type="text" id="commentAuthor" placeholder="您的稱呼">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                  <textarea id="commentText" placeholder="想對創作者說的話..."></textarea>
                </div>
                <button type="button" class="publish-btn" id="submitCommentBtn" style="padding: 0.75rem 1.5rem; font-size: 0.95rem;">送出留言</button>
              </div>
            </div>
          `;

          document.querySelectorAll('.like-btn').forEach(btn => {
            btn.onclick = async () => {
              const pIdx = parseInt(btn.getAttribute('data-project-index'));
              projects[pIdx].likes = (projects[pIdx].likes || 0) + 1;
              btn.querySelector('.like-count').textContent = projects[pIdx].likes;
              try {
                await updateDoc(docRef, { projects: projects });
              } catch (err) { console.error(err); }
            };
          });

          document.getElementById('submitCommentBtn').onclick = async () => {
            const authorInput = document.getElementById('commentAuthor');
            const textInput = document.getElementById('commentText');
            const cName = authorInput.value.trim();
            const cText = textInput.value.trim();

            if (!cName || !cText) {
              alert('請填寫稱呼與留言內容！');
              return;
            }

            const newComment = {
              name: cName,
              text: cText,
              createdAt: new Date().toISOString(),
              replies: []
            };

            try {
              await updateDoc(docRef, { comments: arrayUnion(newComment) });
              comments.push(newComment);
              authorInput.value = '';
              textInput.value = '';
              
              const listContainer = document.getElementById('commentListContainer');
              const noMsg = document.getElementById('noCommentsMsg');
              if (noMsg) noMsg.remove();
              
              listContainer.insertAdjacentHTML('beforeend', buildCommentItemHtml(newComment, comments.length - 1));
            } catch (err) {
              console.error(err);
              alert("送出失敗，請稍後再試。");
            }
          };

          document.getElementById('commentListContainer').addEventListener('click', async (e) => {
            if (e.target.classList.contains('submit-sub-reply-btn')) {
              const commentIdx = parseInt(e.target.getAttribute('data-comment-index'));
              const box = e.target.closest('.sub-reply-box');
              const rNameInput = box.querySelector('.sub-reply-name');
              const rTextInput = box.querySelector('.sub-reply-text');
              const rName = rNameInput.value.trim();
              const rText = rTextInput.value.trim();

              if (!rName || !rText) {
                alert('請填寫稱呼與回覆內容！');
                return;
              }

              const newReply = {
                name: rName,
                text: rText,
                createdAt: new Date().toISOString()
              };

              if (!comments[commentIdx].replies) {
                comments[commentIdx].replies = [];
              }
              comments[commentIdx].replies.push(newReply);

              try {
                await updateDoc(docRef, { comments: comments });
                rNameInput.value = '';
                rTextInput.value = '';
                
                const itemDiv = document.querySelector(`[data-comment-idx="${commentIdx}"]`);
                const replyListContainer = itemDiv.querySelector('.reply-list');
                const rTimeStr = new Date(newReply.createdAt).toLocaleString();
                
                replyListContainer.insertAdjacentHTML('beforeend', `
                  <div style="margin-top: 0.5rem; padding: 0.5rem 0.75rem; background: rgba(0,0,0,0.03); border-left: 2px solid var(--primary); border-radius: 4px;">
                    <div style="font-size: 0.8rem; font-weight: bold; color: var(--primary); display: flex; justify-content: space-between;">
                      <span>💬 ${escapeHtml(newReply.name)}</span>
                      <span style="color: var(--text-muted); font-size: 0.75rem;">${rTimeStr}</span>
                    </div>
                    <div style="font-size: 0.9rem; margin-top: 0.2rem; color: var(--text-main);">${escapeHtml(newReply.text)}</div>
                  </div>
                `);
              } catch (err) {
                console.error(err);
                alert("回覆送出失敗，請稍後再試。");
              }
            }
          });

        } else {
          const defaultData = {
            name: "我的創作者空間",
            bio: "歡迎來到我的個人作品集網站！",
            avatar: "",
            projects: [],
            comments: []
          };
          await setDoc(docRef, defaultData);
          await renderVisitorMode(uId);
        }
      } catch (e) { 
        console.error(e);
        mainContainer.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem;">
            <h2>載入失敗</h2>
            <p style="color: var(--text-muted); margin: 1rem 0;">請檢查網路連線或 Firebase 設定。</p>
            <button class="btn-secondary" id="errBackHome">返回主頁</button>
          </div>
        `;
        const backBtn = document.getElementById('errBackHome');
        if(backBtn) {
          backBtn.onclick = () => { window.location.href = window.location.pathname; };
        }
      }
    }

    async function renderEditorMode(uId) {
      previewBtnContainer.innerHTML = `<button class="btn-secondary" id="previewModeBtn">👁️ 預覽模式</button>`;
      document.getElementById('previewModeBtn').onclick = () => {
        window.location.href = `${window.location.pathname}?id=${uId}`;
      };

      const docRef = doc(db, "users", uId);
      const docSnap = await getDoc(docRef);

      let userData = { name: '', bio: '', avatar: '', projects: [], comments: [] };
      if (docSnap.exists()) {
        userData = docSnap.data();
      } else {
        await setDoc(docRef, userData);
      }

      let projectsHtml = '';
      if (userData.projects && userData.projects.length > 0) {
        userData.projects.forEach((p, index) => {
          projectsHtml += `
            <div class="project-item" data-index="${index}">
              <div class="project-header-row">
                <span class="project-title-label">#${index + 1}</span>
                <button type="button" class="delete-project-btn" data-del-index="${index}">刪除此項</button>
              </div>
              <div class="form-group" style="margin-bottom: 1rem;">
                <label>作品標題</label>
                <input type="text" class="proj-title-input" value="${escapeHtml(p.title || '')}" placeholder="例如：AI 智慧客服系統">
              </div>
              <div class="form-group" style="margin-bottom: 1rem;">
                <label>作品簡述</label>
                <textarea class="proj-desc-input" placeholder="簡述專案背景、架構與成果...">${escapeHtml(p.desc || '')}</textarea>
              </div>
              <div class="form-group">
                <label>標籤 (用空格隔開)</label>
                <input type="text" class="proj-tags-input" value="${escapeHtml(p.tags || '')}" placeholder="React Firebase">
              </div>
            </div>
          `;
        });
      }

      let myCommentsHtml = '';
      const myComments = userData.comments || [];
      if (myComments.length > 0) {
        myComments.forEach((c, index) => {
          myCommentsHtml += buildCommentItemHtml(c, index);
        });
      } else {
        myCommentsHtml = `<p style="color: var(--text-muted); font-size: 0.9rem;">目前還沒有訪客留言。</p>`;
      }

      let creatorsHtml = '';
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        querySnapshot.forEach((d) => {
          if (d.id !== uId) {
            const cData = d.data();
            creatorsHtml += `
              <a href="${window.location.pathname}?id=${d.id}" class="creator-card">
                <img src="${cData.avatar || 'https://via.placeholder.com/45'}" alt="頭貼" class="creator-avatar">
                <div class="creator-info">
                  <h4>${escapeHtml(cData.name || '無名創作者')}</h4>
                  <p>${escapeHtml(cData.bio || '尚未填寫介紹')}</p>
                </div>
              </a>
            `;
          }
        });
      } catch (e) { console.error(e); }

      mainContainer.innerHTML = `
        <div class="card" id="profile-section">
          <h2 class="section-title" data-i18n="profile_title">個人檔案設定</h2>
          <div class="profile-grid">
            <div class="avatar-area">
              <div class="avatar-box" id="avatarBox">
                ${userData.avatar ? `<img src="${userData.avatar}" alt="頭貼">` : `<span class="plus-icon">+</span><span class="upload-text" data-i18n="avatar_text">上傳頭貼</span>`}
              </div>
              <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
              <button type="button" class="upload-btn" id="uploadAvatarBtn">📷 更換頭貼</button>
            </div>
            <div class="profile-fields">
              <div class="form-group">
                <label data-i18n="name_label">創作者名稱</label>
                <input type="text" id="ownerNameInput" value="${escapeHtml(userData.name || '')}" placeholder="創作者名稱">
              </div>
              <div class="form-group">
                <label data-i18n="bio_label">個人簡介 / 座右銘</label>
                <textarea id="ownerBioInput" placeholder="個人簡介">${escapeHtml(userData.bio || '')}</textarea>
              </div>
            </div>
          </div>
        </div>

        <div class="card" id="portfolio-section">
          <div class="section-title">
            <span data-i18n="portfolio_title">精選作品集</span>
            <button type="button" class="header-add-btn" id="addProjectBtn" data-i18n="add_project_btn">+ 新增作品</button>
          </div>
          <div id="projectsEditorContainer">${projectsHtml}</div>
        </div>

        <div class="card publish-section">
          <h2 class="section-title" style="justify-content: center;" data-i18n="publish_title">發佈您的個人網站</h2>
          <p class="publish-desc" data-i18n="publish_desc">點擊下方按鈕將您的最新修改儲存至雲端！</p>
          <button type="button" class="publish-btn" id="publishCloudBtn" data-i18n="publish_btn">🚀 儲存並同步至雲端</button>
        </div>

        <div class="card">
          <h2 class="section-title" data-i18n="my_comments_title">訪客留言與互動紀錄</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;" data-i18n="my_comments_desc">這裡顯示所有訪客留給您的寶貴意見與討論串：</p>
          <div class="comment-list" id="myCommentsEditorList">
            ${myCommentsHtml}
          </div>
        </div>

        <div class="card" id="community-section">
          <h2 class="section-title" data-i18n="community_title">探索其他創作者</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;" data-i18n="community_desc">點擊卡片即可造訪其他創作者的個人作品集！</p>
          <div class="creators-grid">${creatorsHtml}</div>
        </div>
      `;

      const avatarBox = document.getElementById('avatarBox');
      const avatarFileInput = document.getElementById('avatarFileInput');
      avatarBox.onclick = () => avatarFileInput.click();
      document.getElementById('uploadAvatarBtn').onclick = () => avatarFileInput.click();
      avatarFileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            userData.avatar = evt.target.result;
            avatarBox.innerHTML = `<img src="${userData.avatar}" alt="頭貼">`;
          };
          reader.readAsDataURL(file);
        }
      };

      document.getElementById('addProjectBtn').onclick = () => {
        if (!userData.projects) userData.projects = [];
        userData.projects.push({ title: '', desc: '', tags: '', likes: 0 });
        renderProjectsList(userData.projects);
      };

      document.getElementById('projectsEditorContainer').addEventListener('click', (e) => {
        if (e.target.classList.contains('delete-project-btn')) {
          const idx = parseInt(e.target.getAttribute('data-del-index'));
          collectCurrentEditorData(userData);
          userData.projects.splice(idx, 1);
          renderProjectsList(userData.projects);
        }
      });

      document.getElementById('myCommentsEditorList').addEventListener('click', async (e) => {
        if (e.target.classList.contains('submit-sub-reply-btn')) {
          const commentIdx = parseInt(e.target.getAttribute('data-comment-index'));
          const box = e.target.closest('.sub-reply-box');
          const rNameInput = box.querySelector('.sub-reply-name');
          const rTextInput = box.querySelector('.sub-reply-text');
          const rName = rNameInput.value.trim() || userData.name || '創作者';
          const rText = rTextInput.value.trim();

          if (!rText) {
            alert('回覆內容不能為空！');
            return;
          }

          collectCurrentEditorData(userData);

          const newReply = {
            name: rName,
            text: rText,
            createdAt: new Date().toISOString()
          };

          if (!userData.comments[commentIdx].replies) {
            userData.comments[commentIdx].replies = [];
          }
          userData.comments[commentIdx].replies.push(newReply);

          try {
            await setDoc(docRef, {
              name: userData.name,
              bio: userData.bio,
              avatar: userData.avatar,
              projects: userData.projects,
              comments: userData.comments
            }, { merge: true });
            alert('回覆成功！');
            await renderEditorMode(uId);
          } catch (err) {
            console.error(err);
            alert('回覆失敗，請稍後再試。');
          }
        }
      });

      document.getElementById('publishCloudBtn').onclick = async () => {
        collectCurrentEditorData(userData);
        try {
          await setDoc(docRef, {
            name: userData.name,
            bio: userData.bio,
            avatar: userData.avatar,
            projects: userData.projects,
            comments: userData.comments
          }, { merge: true });
          alert('🎉 儲存並同步至雲端成功！');
        } catch (err) {
          console.error(err);
          alert('❌ 儲存失敗，請檢查網路連線。');
        }
      };
    }

    function collectCurrentEditorData(userData) {
      const nameInput = document.getElementById('ownerNameInput');
      const bioInput = document.getElementById('ownerBioInput');
      if (nameInput) userData.name = nameInput.value.trim();
      if (bioInput) userData.bio = bioInput.value.trim();

      const projectItems = document.querySelectorAll('.project-item');
      const updatedProjects = [];
      projectItems.forEach(item => {
        const title = item.querySelector('.proj-title-input').value.trim();
        const desc = item.querySelector('.proj-desc-input').value.trim();
        const tags = item.querySelector('.proj-tags-input').value.trim();
        const oldLikes = item.getAttribute('data-likes') || 0;
        updatedProjects.push({
          title,
          desc,
          tags,
          likes: parseInt(oldLikes)
        });
      });
      userData.projects = updatedProjects;
    }

    function renderProjectsList(projects) {
      const container = document.getElementById('projectsEditorContainer');
      let html = '';
      projects.forEach((p, index) => {
        html += `
          <div class="project-item" data-index="${index}" data-likes="${p.likes || 0}">
            <div class="project-header-row">
              <span class="project-title-label">#${index + 1}</span>
              <button type="button" class="delete-project-btn" data-del-index="${index}">刪除此項</button>
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
              <label>作品標題</label>
              <input type="text" class="proj-title-input" value="${escapeHtml(p.title || '')}" placeholder="例如：AI 智慧客服系統">
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
              <label>作品簡述</label>
              <textarea class="proj-desc-input" placeholder="簡述專案背景、架構與成果...">${escapeHtml(p.desc || '')}</textarea>
            </div>
            <div class="form-group">
              <label>標籤 (用空格隔開)</label>
              <input type="text" class="proj-tags-input" value="${escapeHtml(p.tags || '')}" placeholder="React Firebase">
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
