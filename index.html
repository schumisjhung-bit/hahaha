<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        geek: { dark: '#0b0f19', card: '#111827', accent: '#10b981' }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-geek-dark text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- 導覽列 -->
    <header class="border-b border-gray-800 p-4 flex justify-between items-center max-w-6xl mx-auto w-full">
        <h1 class="text-xl font-bold text-emerald-400">Portfolio Studio</h1>
        <div id="auth-container">
            <button onclick="loginWithGoogle()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-semibold transition">
                Google 登入 (創作者)
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-4xl mx-auto w-full p-6 space-y-8">
        
        <!-- 個人資訊展示區 -->
        <section class="bg-geek-card p-6 rounded-xl border border-gray-800 shadow-lg">
            <h2 id="owner-name" class="text-2xl font-bold mb-2">載入中...</h2>
            <p id="owner-bio" class="text-gray-400 text-sm">歡迎來到我的個人作品集與互動空間。</p>
        </section>

        <!-- 訪客留言與回覆系統區塊 -->
        <section class="bg-geek-card p-6 rounded-xl border border-gray-800 shadow-lg">
            <h3 class="text-lg font-bold mb-4 text-emerald-400">訪客留言板</h3>
            
            <!-- 新增留言表單 (訪客專用) -->
            <div id="new-message-form" class="space-y-3 mb-6 bg-gray-900/50 p-4 rounded-lg border border-gray-800">
                <input type="text" id="visitor-name-input" placeholder="您的暱稱" 
                       class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                <textarea id="visitor-text-input" rows="2" placeholder="留下想對創作者說的話..." 
                          class="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
                <button onclick="submitVisitorMessage('YOUR_OWNER_UID_HERE')" 
                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded transition">
                    送出留言
                </button>
            </div>

            <!-- 留言列表容器 -->
            <div id="message-board-container" class="space-y-4">
                <p class="text-gray-500 text-center py-4">正在載入留言...</p>
            </div>
        </section>

    </main>

    <!-- 核心 JavaScript 邏輯 -->
    <script>
        // TODO: 請填入您的 Firebase 專案設定
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 目標 Portfolio 擁有者的 UID (請替換成您自己的 Firebase UID)
        const TARGET_OWNER_UID = "YOUR_OWNER_UID_HERE";

        // 當頁面載入完成時啟動
        window.addEventListener('DOMContentLoaded', () => {
            initMessageBoard(TARGET_OWNER_UID, 'message-board-container');
            
            // 監聽登入狀態改變
            auth.onAuthStateChanged(user => {
                const authContainer = document.getElementById('auth-container');
                if (user) {
                    authContainer.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-emerald-400">已登入 (${user.displayName || user.email})</span>
                            <button onclick="logout()" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs transition">登出</button>
                        </div>
                    `;
                } else {
                    authContainer.innerHTML = `
                        <button onclick="loginWithGoogle()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-semibold transition">
                            Google 登入 (創作者)
                        </button>
                    `;
                }
                // 重新渲染留言板以套用擁有者回覆權限介面
                initMessageBoard(TARGET_OWNER_UID, 'message-board-container');
            });
        });

        // Google 登入
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(error => {
                console.error("登入失敗：", error);
                alert("登入失敗，請確認 Firebase 設定。");
            });
        }

        // 登出
        function logout() {
            auth.signOut();
        }

        // 1. 即時監聽與渲染留言板
        function initMessageBoard(ownerUserId, containerElementId) {
            const container = document.getElementById(containerElementId);
            if (!container) return;

            const currentUser = auth.currentUser;
            const isOwner = currentUser && currentUser.uid === ownerUserId;

            db.collection('users').doc(ownerUserId).collection('messages')
              .orderBy('createdAt', 'desc')
              .onSnapshot((snapshot) => {
                  let html = '';
                  
                  if (snapshot.empty) {
                      container.innerHTML = `<p class="text-gray-500 text-center py-4">目前尚無留言，趕快留下你的想法吧！</p>`;
                      return;
                  }

                  snapshot.forEach((doc) => {
                      const msg = doc.data();
                      const messageId = doc.id;
                      const dateStr = msg.createdAt ? new Date(msg.createdAt.toDate()).toLocaleString() : '剛剛';

                      html += `
                        <div class="p-4 rounded-lg bg-gray-900/50 border border-gray-800">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-semibold text-emerald-400">${escapeHtml(msg.name)}</span>
                                <span class="text-xs text-gray-500">${dateStr}</span>
                            </div>
                            <p class="text-gray-300 text-sm mb-3">${escapeHtml(msg.text)}</p>
                      `;

                      // 顯示回覆
                      if (msg.reply && msg.reply.text) {
                          const replyDateStr = msg.reply.createdAt ? new Date(msg.reply.createdAt.toDate()).toLocaleString() : '';
                          html += `
                            <div class="ml-4 mt-3 p-3 rounded bg-gray-950 border-l-2 border-emerald-500">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-xs font-bold text-emerald-300">創作者回覆</span>
                                    <span class="text-xs text-gray-500">${replyDateStr}</span>
                                </div>
                                <p class="text-gray-300 text-sm">${escapeHtml(msg.reply.text)}</p>
                            </div>
                          `;
                      }

                      // 若為擁有者，顯示回覆輸入介面
                      if (isOwner) {
                          html += `
                            <div class="mt-3 pt-2 border-t border-gray-800">
                                <div class="flex gap-2">
                                    <input type="text" id="reply-input-${messageId}" placeholder="回覆這位訪客..." 
                                           class="flex-1 bg-gray-950 border border-gray-700 rounded px-3 py-1 text-sm text-white focus:outline-none focus:border-emerald-500">
                                    <button onclick="submitReply('${ownerUserId}', '${messageId}')" 
                                            class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-sm rounded transition">
                                        送出回覆
                                    </button>
                                </div>
                            </div>
                          `;
                      }

                      html += `</div>`;
                  });

                  container.innerHTML = html;
              }, (error) => {
                  console.error("載入留言發生錯誤：", error);
                  container.innerHTML = `<p class="text-red-400 text-center py-4">載入留言發生錯誤。</p>`;
              });
        }

        // 2. 訪客送出新留言
        async function submitVisitorMessage(ownerUserId) {
            const nameInput = document.getElementById('visitor-name-input');
            const textInput = document.getElementById('visitor-text-input');
            
            const name = nameInput.value.trim();
            const text = textInput.value.trim();

            if (!name || !text) {
                alert('請填寫姓名與留言內容！');
                return;
            }

            try {
                await db.collection('users').doc(ownerUserId).collection('messages').add({
                    name: name,
                    text: text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    reply: null
                });

                textInput.value = '';
                alert('留言成功！');
            } catch (error) {
                console.error("送出留言失敗：", error);
                alert('留言送出失敗，請檢查網路連線或 Firestore 權限。');
            }
        }

        // 3. 擁有者送出回覆
        async function submitReply(ownerUserId, messageId) {
            const replyInput = document.getElementById(`reply-input-${messageId}`);
            if (!replyInput) return;

            const replyText = replyInput.value.trim();
            if (!replyText) {
                alert('回覆內容不得為空！');
                return;
            }

            const currentUser = auth.currentUser;
            if (!currentUser || currentUser.uid !== ownerUserId) {
                alert('權限不足：只有此作品集的擁有者可以回覆留言。');
                return;
            }

            try {
                const messageRef = db.collection('users').doc(ownerUserId).collection('messages').doc(messageId);
                await messageRef.update({
                    reply: {
                        text: replyText,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }
                });

                replyInput.value = '';
                console.log('回覆已成功送出');
            } catch (error) {
                console.error("送出回覆失敗：", error);
                alert('回覆送出失敗，請確認 Firestore 權限規則。');
            }
        }

        // XSS 安全防護
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
